<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SakeYō — Tochigi, on a phone</title>
<link href="https://api.fontshare.com/v2/css?f[]=supreme@400,500,600,700&display=swap" rel="stylesheet">
<style>
  :root{--desk:#0d131a;--crimson-bright:#F03D4D;--w:390px;--h:844px}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:radial-gradient(120% 90% at 50% 0%,#18212b 0%,var(--desk) 60%,#070b0f 100%);
       font-family:'Supreme',system-ui,-apple-system,sans-serif;color:#fff;
       display:flex;flex-direction:column;align-items:center;justify-content:center;
       gap:18px;overflow:hidden;padding:16px}

  .stagewrap{display:flex;align-items:center;justify-content:center;flex:1;min-height:0;width:100%}
  .device{position:relative;flex:0 0 auto;
    width:calc(var(--w) + 24px);height:calc(var(--h) + 24px);
    background:linear-gradient(160deg,#3a3f46,#15181c 40%,#0a0c0f);
    border-radius:60px;padding:12px;
    box-shadow:0 2px 0 rgba(255,255,255,.14) inset,0 0 0 1px rgba(0,0,0,.9),
               0 40px 90px rgba(0,0,0,.65),0 10px 30px rgba(0,0,0,.5);
    transform-origin:center center}
  .screen{position:relative;width:var(--w);height:var(--h);border-radius:48px;
    overflow:hidden;background:#F5F0EB;box-shadow:0 0 0 2px #000}
  iframe{width:100%;height:100%;border:0;display:block;background:#F5F0EB}
  /* dynamic island + home indicator sit above the page, but never eat taps */
  .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);
    width:112px;height:31px;background:#000;border-radius:20px;z-index:4;pointer-events:none}
  .homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
    width:138px;height:5px;border-radius:3px;background:rgba(0,0,0,.32);z-index:4;pointer-events:none}
  .btn-side{position:absolute;background:#20242a;border-radius:2px}
  .b1{left:-3px;top:150px;width:3px;height:34px}
  .b2{left:-3px;top:200px;width:3px;height:58px}
  .b3{left:-3px;top:272px;width:3px;height:58px}
  .b4{right:-3px;top:210px;width:3px;height:92px}

  .bar{display:flex;align-items:center;gap:10px;flex:0 0 auto;flex-wrap:wrap;justify-content:center}
  button{font:inherit;font-size:13px;font-weight:500;color:#e8e4de;cursor:pointer;
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
    border-radius:999px;padding:9px 16px;display:inline-flex;align-items:center;gap:7px;
    -webkit-tap-highlight-color:transparent}
  button:hover{background:rgba(255,255,255,.13)}
  button:active{transform:translateY(1px)}
  button svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round}
  .now{font-size:12px;color:rgba(255,255,255,.42);max-width:min(560px,90vw);text-align:center;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dots{display:flex;gap:7px;align-items:center;padding-left:4px}
  .dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.22);cursor:pointer;
    border:0;padding:0}
  .dot.on{background:var(--crimson-bright)}
  .dots:empty{display:none}
  @media (max-width:480px){ .now{display:none} }
</style>
</head>
<body>

<div class="stagewrap">
  <div class="device" id="device">
    <span class="btn-side b1"></span><span class="btn-side b2"></span>
    <span class="btn-side b3"></span><span class="btn-side b4"></span>
    <div class="screen">
      <div class="island"></div>
      <iframe id="scr" src="tochigi-prefecture-mockup-v2.html" title="SakeYō"></iframe>
      <div class="homebar"></div>
    </div>
  </div>
</div>

<div class="bar">
  <button id="back" title="Back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>Back</button>
  <button id="home" title="Prefecture page"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Home</button>
  <button id="menu" title="All screens"><svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>Index</button>
  <div class="dots" id="dots"></div>
  <div class="now" id="now"></div>
</div>

<script>
(function(){
  var START = 'tochigi-prefecture-mockup-v2.html';
  var scr = document.getElementById('scr');
  var dots = document.getElementById('dots');
  var now = document.getElementById('now');
  var device = document.getElementById('device');
  var current = START;

  // Scale the device to fit whatever room the browser gives us.
  function fit(){
    var pad = 34;                                   // breathing room
    var barH = document.querySelector('.bar').offsetHeight + 30;
    var availH = window.innerHeight - barH - pad;
    var availW = window.innerWidth - pad;
    var s = Math.min(availW / (390 + 24), availH / (844 + 24), 1);
    device.style.transform = 'scale(' + Math.max(s, 0.3) + ')';
  }
  window.addEventListener('resize', fit);
  fit();

  document.getElementById('back').onclick = function(){ history.back(); };
  document.getElementById('home').onclick = function(){ scr.src = START; };
  document.getElementById('menu').onclick = function(){ scr.src = 'index.html'; };

  // The screens report themselves once they load inside the frame.
  window.addEventListener('message', function(e){
    var d = e.data;
    if (!d) return;
    if (d.type === 'sy-back'){ history.back(); return; }   // app bar chevron
    if (d.type !== 'sy') return;
    if (d.file) current = d.file;
    now.textContent = d.title || '';
    dots.innerHTML = '';
    if (d.count > 1){
      for (var i = 0; i < d.count; i++){
        (function(i){
          var b = document.createElement('button');
          b.className = 'dot' + (i === d.index ? ' on' : '');
          b.title = d.caps[i] || ('Screen ' + (i + 1));
          b.onclick = function(){ scr.src = current + '?s=' + i; };
          dots.appendChild(b);
        })(i);
      }
    }
  });

  // If a page can't talk to us (offline file:// origins), don't leave the label stale.
  scr.addEventListener('load', function(){
    setTimeout(function(){ if (!now.textContent) now.textContent = ''; }, 400);
  });
})();
</script>
</body>
</html>
